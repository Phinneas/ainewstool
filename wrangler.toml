# Cloudflare Workers Configuration for AI Newsletter Ingest
name = "ainewsletter-ingest"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Plain (non-secret) vars. Changing these is a config deploy, not a code change.
[vars]
# Claude model for stages 5-6. Pinned snapshot IDs only — every ID from the 4.6
# generation on is a pinned snapshot, so this does not drift.
#   claude-sonnet-5-5       current default ($2/$10 per MTok, 1M ctx)
#   claude-sonnet-4-6       standing fallback (accepts thinking:{type:'disabled'})
# Do NOT set claude-sonnet-4-5-20250929 — its retirement commitment expired
# 2026-09-29 and it is $3/$15, i.e. 50% more expensive than 5.5.
ANTHROPIC_MODEL = "claude-sonnet-5-5"

# Stage 3 relevance provider:
#   mistral — previous behaviour (Mistral Small, chat + JSON parse)
#   shadow  — calls BOTH, acts on Mistral, logs the Jev answer for calibration
#   jev     — Jev decides (typesafe/jev-1.13 via OpenRouter)  <-- ACTIVE
# Rollback is setting this back to "mistral" and redeploying — no code revert.
# Note: RELEVANCE_THRESHOLD below has never been measured against real traffic.
# Watch the `relevant` / `rejected` metrics on the first run against historical
# baseline; a big drop in `relevant` means the threshold is too strict.
EVAL_PROVIDER = "jev"

# Jev noul cut point. Deliberately below 0.5: the Mistral prompt said "be
# reasonably inclusive", and that sentence WAS the threshold. A false accept
# costs one slot in stage 5's shortlist (which filters again); a false reject
# is cached for 24h and the story is gone from that issue. Tune from the
# `shadow jev comparison` logs before flipping EVAL_PROVIDER to "jev".
RELEVANCE_THRESHOLD = "0.35"

# Char cap on article content before it reaches Jev (32K token context; a
# larger payload 413s). 60k chars is deliberately conservative — Jev's
# tokenizer is unpublished. Calibrate from `jev_input_tokens` vs article size
# in shadow mode, then set this to ~85% of 32k tokens.
STATE_CHAR_BUDGET = "60000"

# Scheduled triggers (runs on Cloudflare, no computer needed)
[triggers]
crons = [
  "0 7 * * 1-5", # Ingest weekday mornings at 7am UTC
  "0 8 * * 3",   # Generate newsletter Wednesday 8am UTC
  "0 8 * * 6",   # Generate newsletter Saturday 8am UTC
]

# Queue bindings - producers to SEND messages
[[queues.producers]]
queue = "scrape-queue"
binding = "SCRAPE_QUEUE"

[[queues.producers]]
queue = "evaluate-queue"
binding = "EVALUATE_QUEUE"

[[queues.producers]]
queue = "upload-queue"
binding = "UPLOAD_QUEUE"

[[queues.producers]]
queue = "generate-queue"
binding = "GENERATE_QUEUE"

[[queues.producers]]
queue = "publish-queue"
binding = "PUBLISH_QUEUE"

# Queue bindings - consumers to PROCESS messages
[[queues.consumers]]
queue = "scrape-queue"
max_batch_size = 10
max_batch_timeout = 30

[[queues.consumers]]
queue = "evaluate-queue"
max_batch_size = 20
max_batch_timeout = 30

[[queues.consumers]]
queue = "upload-queue"
max_batch_size = 30
max_batch_timeout = 30

[[queues.consumers]]
queue = "generate-queue"
max_batch_size = 1
max_batch_timeout = 60

[[queues.consumers]]
queue = "publish-queue"
max_batch_size = 1
max_batch_timeout = 30

# R2 bucket for content storage
[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "ainewsletter"

# KV namespace for tracking state and deduplication
[[kv_namespaces]]
binding = "INGEST_STATE"
id = "d858fcdf0fc84221908e17c523f05aa6"

# mymcpshelf's D1 database, cross-bound so publish can write blog posts
# directly without git/GitHub API — this Worker never touches that repo.
[[d1_databases]]
binding = "MYMCPSHELF_DB"
database_name = "mcp-directory"
database_id = "527bf637-7aba-4719-8d39-b9e6e614a3b9"

# Secrets (set via wrangler secret put)
# - FIRECRAWL_API_KEY
# - ANTHROPIC_API_KEY
# - MISTRAL_API_KEY
# - MOONSHOT_API_KEY
# - OPENROUTER_API_KEY           (required only when EVAL_PROVIDER is jev|shadow)
# - EXA_API_KEY
# - TAVILY_API_KEY
# - PARALLEL_API_KEY
# - PARALLEL_MONITOR_RESEARCH_ID
# - PARALLEL_MONITOR_STARTUP_ID
# - BEEHIIV_API_KEY
# - BEEHIIV_PUBLICATION_ID
# - IDEOGRAM_API_KEY             (optional)
# - PEXELS_API_KEY               (optional — header images for D1 posts)
# - SURREALDB_URL
# - SURREALDB_NS
# - SURREALDB_DB
# - SURREALDB_USER
# - SURREALDB_PASS

# Enable observability
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
